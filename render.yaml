services:
  - type: web
    name: conectagro-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    plan: free
    region: virginia
    branch: main
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_FLAVOR
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
