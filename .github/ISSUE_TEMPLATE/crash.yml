name: Crash
description: Relate uma falha crítica (erro 500, tela branca, aplicação indisponível)
title: "<Seu Título>"
labels: ["Crash", "status: Aguardando revisão"]
body:
  - type: markdown
    attributes:
      value: "Se puder, inclua logs do servidor (`docker compose logs`) ou o console do navegador."
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: "1.\n2.\n3."
    validations:
      required: true
  - type: textarea
    id: atual
    attributes:
      label: Resultado atual
    validations:
      required: true
  - type: dropdown
    id: frequencia
    attributes:
      label: Frequência
      options:
        - Sempre
        - Às vezes
        - Raro
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
      description: Cole aqui qualquer log relevante (stack trace do servidor, console do navegador, etc.)
  - type: dropdown
    id: componente
    attributes:
      label: Componente afetado
      description: Selecione em qual parte do monorepositório o crash foi encontrado
      options:
        - Frontend (web)
        - Backend (server)
        - Banco de dados
        - Infraestrutura (Docker/CI)
        - Outro
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Navegador
      description: Qual o navegador que você usou (se o crash ocorreu no frontend)
      options:
        - Google Chrome
        - Microsoft Edge
        - Firefox
        - Opera
        - Safari
        - Outros
        - N/A
  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Insira qualquer outra informação extra que julgar relevante
