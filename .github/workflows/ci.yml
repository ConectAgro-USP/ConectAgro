name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci --ignore-scripts

      - name: Lint web
        working-directory: ./web
        run: npm run lint

      - name: Test web
        working-directory: ./web
        run: npm test

      - name: Build web
        working-directory: ./web
        run: npm run build

  server:
    name: Server lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Install server dependencies
        working-directory: ./server
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Lint server
        working-directory: ./server
        run: ruff check .

      - name: Test server
        working-directory: ./server
        run: pytest

  migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # a mesma versão do docker-compose.yml
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conectagro
          POSTGRES_PASSWORD: conectagro
          POSTGRES_DB: conectagro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conectagro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_FLAVOR: dev
      DATABASE_URL: postgresql://conectagro:conectagro@localhost:5432/conectagro
      SESSION_SECRET_KEY: ci-session-secret-with-at-least-32-chars
      JWT_SECRET_KEY: ci-jwt-secret-with-at-least-32-characters

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Install server dependencies
        working-directory: ./server
        run: pip install --no-cache-dir -r requirements.txt

      - name: Apply every migration
        working-directory: ./server
        run: alembic upgrade head

      - name: Check the database is at the single head
        working-directory: ./server
        run: |
          current="$(alembic current)"
          heads="$(alembic heads)"
          echo "current: $current"
          echo "heads: $heads"
          [ "$(echo "$heads" | wc -l)" -eq 1 ]
          [ "${current%% *}" = "${heads%% *}" ]
